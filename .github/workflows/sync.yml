name: 同步上游代码和提交记录

on:
  schedule:
    - cron: '0 */12 * * *'   # 每12时同步一次
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@main
        with:
          fetch-depth: 0   # 完整历史

      -  name: 删除工作流
         uses: Mattraks/delete-workflow-runs@main
         with:
          token: ${{ secrets.GITHUB_TOKEN }}
          retain_days: 0
          keep_minimum_runs: 0

      - name: 配置 Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: 添加 upstream 并拉取
        run: |
          git remote add upstream https://github.com/qist/tvbox.git ||true
          git fetch upstream --tags --force

      - name: 同步 master 分支（merge）
        run: |
          git checkout master
          # 尝试正常 merge，冲突时创建备份再强制
          if ! git merge upstream/master --allow-unrelated-histories --no-edit; then
            echo "合并冲突，创建备份分支..."
            git merge --abort
            BACKUP_BRANCH="backup/master-$(date +%Y%m%d%H%M%S)"
            git branch $BACKUP_BRANCH
            git push origin $BACKUP_BRANCH
            git reset --hard upstream/master
            echo "已备份并强制同步"
          else
            echo "合并成功，无冲突"
          fi

      - name: 推送到私有仓库
        run: |
          git push origin master || git push origin master --force || echo "无需推送"  # ✅ 普通push失败时再强制
          git push origin --tags || echo "无 tag 更新"
